name: CI
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build Windows app
        run: dotnet build apps/windows/LocalDrop.Windows/LocalDrop.Windows.csproj -p:Platform=x64 --configuration Release
      - name: Protocol and identity tests
        run: dotnet test apps/windows/LocalDrop.Core.Tests/LocalDrop.Core.Tests.csproj --configuration Release

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and unit test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
